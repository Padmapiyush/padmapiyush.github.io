<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with dark slate tone matching portfolio theme -->
  <rect width="1200" height="630" fill="#1A1E24"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#363E48" opacity="0.6"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 150) rotate(90) scale(400 600)">
      <stop stop-color="#CF6D41" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1A1E24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 500) rotate(90) scale(300 450)">
      <stop stop-color="#D48B6A" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#1A1E24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Border Accent -->
  <rect x="40" y="40" width="1120" height="550" rx="16" stroke="#363E48" stroke-width="2"/>
  
  <!-- Monogram Logo Box -->
  <rect x="90" y="90" width="64" height="64" rx="12" fill="#212730" stroke="#CF6D41" stroke-width="2"/>
  <text x="122" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#E6E3DC" text-anchor="middle">PP</text>

  <!-- Tagline Badges -->
  <rect x="175" y="105" width="280" height="34" rx="17" fill="#212730" stroke="#CF6D41" stroke-width="1.5"/>
  <circle cx="195" cy="122" r="4" fill="#CF6D41"/>
  <text x="210" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#CF6D41">Google Certified Data Analyst</text>

  <rect x="470" y="105" width="260" height="34" rx="17" fill="#212730" stroke="#363E48" stroke-width="1.5"/>
  <text x="500" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#9F9B93">Open to International Relocation</text>

  <!-- Main Headline / Name -->
  <text x="90" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#E6E3DC" letter-spacing="-1">Padmapiyush Pathak</text>
  
  <text x="90" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#CF6D41">
    Data Analyst &amp; Analytics Engineer <tspan fill="#9F9B93" font-weight="400">at IDEMIA Public Security</tspan>
  </text>

  <!-- Pitch Statement -->
  <text x="90" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#9F9B93" font-weight="400">
    Full-cycle Data Analyst commanding raw 10M+ daily ETL pipelines down to executive Power BI decisions.
  </text>

  <!-- Key Metrics Highlights Row -->
  <g transform="translate(90, 395)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="220" height="130" rx="12" fill="#212730" stroke="#363E48" stroke-width="1.5"/>
    <text x="24" y="48" font-family="monospace" font-size="36" font-weight="bold" fill="#CF6D41">95%</text>
    <text x="24" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#E6E3DC">Reporting Automation</text>
    <text x="24" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9F9B93">Manual effort eliminated</text>

    <!-- Metric 2 -->
    <rect x="240" y="0" width="220" height="130" rx="12" fill="#212730" stroke="#363E48" stroke-width="1.5"/>
    <text x="264" y="48" font-family="monospace" font-size="36" font-weight="bold" fill="#CF6D41">20+</text>
    <text x="264" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#E6E3DC">Power BI Dashboards</text>
    <text x="264" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9F9B93">Enterprise KPI portals</text>

    <!-- Metric 3 -->
    <rect x="480" y="0" width="220" height="130" rx="12" fill="#212730" stroke="#363E48" stroke-width="1.5"/>
    <text x="504" y="48" font-family="monospace" font-size="36" font-weight="bold" fill="#CF6D41">10M+</text>
    <text x="504" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#E6E3DC">Daily Records</text>
    <text x="504" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9F9B93">Azure ADF &amp; Databricks</text>

    <!-- Metric 4 -->
    <rect x="720" y="0" width="280" height="130" rx="12" fill="#212730" stroke="#363E48" stroke-width="1.5"/>
    <text x="744" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#CF6D41">Spot &amp; Shining Star</text>
    <text x="744" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#E6E3DC">Corporate Excellence Awards</text>
    <text x="744" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9F9B93">12% A/B Test Cost Reduction</text>
  </g>
  
  <!-- Website URL Tag -->
  <text x="1090" y="555" font-family="monospace" font-size="14" fill="#9F9B93" text-anchor="end">padmapiyush.github.io</text>
</svg>

